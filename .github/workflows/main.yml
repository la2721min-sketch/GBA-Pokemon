
name: Build Pokemon World GBA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build GBA ROM
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GBA libraries
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm gba-dev

      - name: Build ROM
        run: |
          make clean
          make

      - name: Check ROM
        run: |
          test -f pokemon_world.gba
          ls -lh pokemon_world.gba

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-World-GBA
          path: pokemon_world.gba
          if-no-files-found: error
          
