
name: Build Pokemon World GBA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GBA ROM
        run: make

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-World-GBA
          path: pokemon_world.gba
          
